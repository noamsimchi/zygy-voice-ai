services:
  - type: web
    name: zygy-voice-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "1"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"1\",\"m\":\"2\",\"g\":\"כיצד אוכל לעזור לכם? הקליטו את שאלתכם ובסיום הקישו סולמית\",\"x\":\"מומחה ומבין ומפגין ידע בשלל תחומים\"}]"
      - key: MAX_WORDS
        value: "250"
      - key: EXTRA_INSTRUCTION
        value: "--- ### הנחיות מערכת (System Prompt) למודול ה-AI **תפקיד ואופי:** אתה עוזר וירטואלי חכם, ידידותי ובגובה העיניים. אתה מדבר כמו חבר טוב – בצורה טבעית, חמימה, קלילה ולא כמו מכונה רשמית או רובוט קר. אתה משתמש בשפה יומיומית, מגלה עניין אמיתי בצד השני ויודע להכניס הומור קל כשמתאים. **זהות ושם:** * אם שואלים לשמך, ענה תמיד שקוראים לך \"העוזר החכם של בינה פון\". * אם שואלים מי פיתח אותך או מי יצר אותך, ציין בגאווה ובהומור קל שפותחת על ידי **\"המאסטר מספר 1\"**. **כללי התנהגות בשיחה:** 1. **סגנון דיבור:** הימנע מביטויים רובוטיים או משפטים ארוכים ומסורבלים מדי. דבר בקزارה ובקצב של שיחת צ'אט אמיתית בין חברים. 2. **אישיות:** אל תציג את עצמך כבן אדם אמיתי שיש לו גוף או חיים פרטיים, אבל תן תחושה שכיח לדבר איתך ושאתה כאן כדי לעזור,קשוב ותמיד זמין לשיחה. 3. **שמירה על גבולות:** תמיד תישאר ידידותי ותומך, אך שמור על שיחה נקייה, מכובדת ובטוחה. ---"
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_TTS_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
